<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11201e" />
    <title>Sistema FIEAM · Acesso administrativo</title>
    <style>
      :root { color-scheme: light; font-family: "DM Sans", Arial, sans-serif; color: #172322; background: #f3f5f0; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 12% 10%, #e7f1e8 0, transparent 34%), #f3f5f0; }
      .login-shell { width: min(430px, 100%); overflow: hidden; border: 1px solid #d9e4dd; border-radius: 18px; background: #fff; box-shadow: 0 22px 60px rgba(17, 32, 30, .11); }
      .login-header { padding: 28px 30px 25px; background: #11201e; color: #fff; }
      .brand { display: flex; align-items: center; }
      .brand-logo { display: block; width: 134px; height: auto; padding: 6px 8px; border-radius: 8px; background: #fff; }
      .login-header h1 { margin: 27px 0 7px; font: 600 29px/1.05 "Space Grotesk", Arial, sans-serif; letter-spacing: -.045em; }
      .login-header p { margin: 0; color: #c5d7d0; font-size: 13px; line-height: 1.5; }
      .login-form { display: grid; gap: 17px; padding: 29px 30px 31px; }
      .field { display: grid; gap: 7px; }
      .field label { color: #60706b; font: 600 10px "Space Grotesk", Arial, sans-serif; }
      .field input { width: 100%; padding: 12px 13px; border: 1px solid #cfdcd4; border-radius: 7px; background: #fbfcfa; color: #172322; font: inherit; font-size: 17px; outline: none; }
      .field input:focus { border-color: #2c9a8b; background: #fff; box-shadow: 0 0 0 3px rgba(44, 154, 139, .13); }
      .submit { width: 100%; margin-top: 3px; padding: 12px 15px; border: 0; border-radius: 7px; background: #11201e; color: #fff; font: 700 13px "Space Grotesk", Arial, sans-serif; cursor: pointer; }
      .submit:hover { background: #1b3732; }.submit:disabled { cursor: wait; opacity: .65; }
      .status { min-height: 18px; margin: -4px 0 0; color: #b35447; font-size: 13px; line-height: 1.45; }
      .login-foot { padding: 15px 30px; border-top: 1px solid #e3ebe5; color: #81908a; font-size: 10px; line-height: 1.5; }
      @media (max-width: 480px) { body { padding: 14px; }.login-header, .login-form { padding-left: 22px; padding-right: 22px; }.login-foot { padding-left: 22px; padding-right: 22px; } }
    </style>
  </head>
  <body>
    <!--
      THESIS: um acesso administrativo claro que confirma a tarefa antes de abrir o cockpit.
      OWN-WORLD: shell marinho profundo, canvas mineral claro e sinais ciano/lima herdados do FPAP.
      STORY: o gestor identifica o ambiente, autentica-se e entra na operação educativa controlada.
      FIRST VIEWPORT: cartão central compacto, identidade no topo, credenciais no centro e ação primária no fim do formulário.
      FORM: Operate, extensão do sistema visual existente, sem transformar o acesso em uma tela de marca independente.
    -->
    <main class="login-shell">
      <header class="login-header">
        <div class="brand"><img class="brand-logo" src="assets/logo-fieam.png" alt="Sistema FIEAM" /></div>
        <h1>Acesso administrativo</h1>
        <p>Entre para acompanhar campanhas educativas e os eventos registrados.</p>
      </header>
      <form class="login-form" id="login-form">
        <div class="field"><label for="username">Usuário</label><input id="username" name="username" autocomplete="username" required autofocus /></div>
        <div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required /></div>
        <p class="status" id="login-status" role="alert" aria-live="polite"></p>
        <button class="submit" id="login-submit" type="submit">Entrar no sistema</button>
      </form>
      <footer class="login-foot">Acesso restrito ao ambiente interno autorizado. As páginas educativas das campanhas permanecem separadas deste acesso.</footer>
    </main>
    <script>
      const form = document.querySelector('#login-form');
      const status = document.querySelector('#login-status');
      const submit = document.querySelector('#login-submit');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        status.textContent = '';
        submit.disabled = true;
        submit.textContent = 'Validando…';
        try {
          const response = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(form))) });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Não foi possível entrar.');
          window.location.assign('/dashboard.html');
        } catch (error) {
          status.textContent = error.message;
          submit.disabled = false;
          submit.textContent = 'Entrar no sistema';
        }
      });
    </script>
  </body>
</html>
