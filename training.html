<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Treinamento · Sistema FIEAM</title>
  <style>
    :root{color:#172322;background:#f3f5f0}body{font:400 16px/1.5 system-ui,sans-serif;margin:0;padding:28px 16px}main{width:min(760px,100%);margin:auto;background:#fff;border:1px solid #dce8e2;border-radius:16px;overflow:hidden;box-shadow:0 16px 45px #11201e14}.brand{padding:18px 28px;border-bottom:1px solid #edf1ed}.brand img{display:block;width:128px;height:auto}.band{padding:12px 28px;background:#e8f5ee;border-bottom:1px solid #a8ddbd;color:#23633b;font-size:13px;font-weight:bold}.content{padding:30px 32px 34px}.eyebrow{color:#2c9a8b;text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-weight:bold}.content h1,.module h2,.quiz h2{font:700 30px/1.16 Georgia,serif}.content h1{margin:9px 0 12px}.summary{margin:0 0 24px;color:#52615d;font-size:16px;line-height:1.55}.module-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}.module-nav button{border:1px solid #dce8e2;border-radius:8px;background:#fff;padding:9px 12px;color:#52615d;cursor:pointer}.module-nav button.active,.module-nav button.done{border-color:#8ac4a2;background:#f0faf3;color:#23633b}.module{padding:22px;border:1px solid #e2ebe5;border-radius:12px;background:#fbfcfa}.module h2{margin:0 0 12px;font-size:21px}.module p{color:#52615d;line-height:1.65}.points{display:grid;gap:9px;margin-top:18px}.point{display:flex;gap:9px;padding:11px 12px;border-radius:8px;background:#f0f5f0;color:#52615d;line-height:1.45}.point b{color:#4e9a78}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:24px}.button{border:0;border-radius:8px;padding:12px 16px;background:#19312d;color:#fff;font-weight:bold;cursor:pointer}.button.secondary{background:#f0f5f0;color:#19312d}.quiz{display:none;margin-top:22px;padding:22px;border:1px solid #dce8e2;border-radius:12px}.quiz.show{display:block}.quiz h2{margin-top:0}.quiz label{display:block;padding:12px;margin:9px 0;border:1px solid #e2ebe5;border-radius:8px;color:#52615d;cursor:pointer}.quiz label:has(input:checked){border-color:#8ac4a2;background:#f0faf3}.notice{display:none;margin-top:17px;padding:13px;border-radius:8px;background:#f0faf3;color:#23633b}.notice.show{display:block}.footer{padding:16px 28px;border-top:1px solid #edf1ed;color:#61706e;font-size:12px}@media(max-width:560px){.content{padding:24px 20px}.content h1{font-size:25px}.brand,.band,.footer{padding-left:20px;padding-right:20px}.actions{justify-content:stretch}.actions .button{flex:1}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="assets/logo-fieam.png" alt="Sistema FIEAM"></div>
    <div class="band">Treinamento de conscientização</div>
    <section class="content">
      <div class="eyebrow">Programa de aprendizagem</div>
      <h1 id="course-title">Treinamento</h1>
      <p class="summary" id="course-summary"></p>
      <nav class="module-nav" id="module-nav" aria-label="Módulos"></nav>
      <article class="module"><h2 id="module-title"></h2><p id="module-text"></p><div class="points" id="module-points"></div><div class="actions"><button class="button secondary" id="previous-button" type="button">Anterior</button><button class="button" id="next-button" type="button">Marcar módulo como lido</button></div></article>
      <section class="quiz" id="quiz"><h2>Avaliação rápida</h2><p id="quiz-question"></p><div id="quiz-options"></div><div class="actions"><button class="button" id="quiz-button" type="button">Concluir curso</button></div></section>
      <div class="notice" id="notice" role="status"></div>
    </section>
    <footer class="footer">Conteúdo educativo do Sistema FIEAM · não solicita senhas, códigos ou qualquer credencial.</footer>
  </main>
  <script>
    const courses={
      phishing:{title:'Phishing: identificar, reportar e agir',summary:'Reconheça mensagens manipuladoras, valide links e reporte tentativas com segurança.',modules:[['O que é phishing','Phishing é uma tentativa de manipular alguém para clicar, abrir um arquivo ou compartilhar uma informação. A mensagem pode parecer legítima, mas o contexto, o endereço do remetente e o pedido precisam fazer sentido juntos.',['Desconfie de urgência artificial, ameaça ou prêmio inesperado.','Confirme a solicitação por um canal corporativo conhecido.','Nunca informe senha, código MFA ou dados sensíveis a partir de um link recebido.']],['Pare, verifique e só então aja','Antes de clicar, passe o cursor sobre o link e confira o domínio real. Procure pequenas alterações no endereço, remetentes externos, anexos inesperados e pedidos que fogem do processo normal.',['Confira o domínio completo, não apenas o nome exibido.','Não habilite macros, scripts ou conteúdo ativo de arquivos desconhecidos.','Se houver dúvida, abra o portal pelo favorito oficial ou digite o endereço manualmente.']],['Como reportar','Ao identificar uma mensagem suspeita, preserve o contexto e use o canal oficial de reporte da organização. Evite encaminhar a mensagem para colegas, responder ao remetente ou testar o link em outros dispositivos.',['Use o botão ou canal corporativo de reporte.','Informe assunto, remetente e motivo da suspeita.','Se clicou, reporte imediatamente e siga a orientação da equipe de segurança.']]],quiz:['Você recebe um e-mail urgente com um link para “regularizar o acesso”. Qual é a atitude mais segura?',['Clicar rapidamente para evitar o bloqueio.','Responder pedindo confirmação ao remetente.','Validar o endereço por canal oficial e reportar se houver dúvida.'],2]},
      malware:{title:'Malware: reduzir o risco no dia a dia',summary:'Aprenda a lidar com anexos, instaladores, dispositivos removíveis e sinais de um possível incidente.',modules:[['Como o malware chega','Malware é um software criado para causar dano, espionar, interromper ou obter acesso indevido. Ele pode chegar por anexos, links, pendrives, instaladores falsos ou sites comprometidos.',['Trate executáveis, atalhos e arquivos compactados inesperados como suspeitos.','Não instale programas fora do catálogo ou sem aprovação.','Não conecte dispositivos removíveis desconhecidos ao equipamento corporativo.']],['Barreiras simples','Atualizações, antivírus, menor privilégio e cópias de segurança reduzem o impacto, mas dependem de hábitos consistentes. A proteção não substitui a análise do contexto.',['Mantenha sistema e aplicativos atualizados pelo canal oficial.','Não desative a proteção para abrir um arquivo ou acelerar uma tarefa.','Use somente contas e permissões necessárias para o trabalho.']],['Suspeita ou incidente','Comportamentos como janelas inesperadas, lentidão súbita, arquivos renomeados ou alertas de segurança devem ser reportados. Interromper a propagação cedo ajuda a proteger outras pessoas.',['Pare de interagir com o conteúdo suspeito.','Desconecte a rede apenas se essa for a orientação do procedimento interno.','Contate a equipe responsável e registre o que aconteceu, sem apagar evidências.']]],quiz:['Um anexo inesperado pede para habilitar macros. O que você faz?',['Habilita macros para visualizar o documento.','Fecha o arquivo e reporta pelo canal oficial.','Envia o arquivo para um colega testar.'],1]},
      passwords:{title:'Troca periódica de senha',summary:'Use senhas únicas, MFA e os canais oficiais para manter suas contas protegidas.',modules:[['Senha forte e única','Uma senha deve ser longa, exclusiva para cada serviço e difícil de associar à pessoa. Reutilizar a mesma senha amplia o impacto de qualquer vazamento.',['Prefira uma frase-senha longa e exclusiva.','Não use nome, data, empresa, time ou padrão previsível.','Nunca compartilhe sua senha com colegas ou por e-mail.']],['Troca com segurança','A troca periódica deve seguir a política oficial e ocorrer no portal conhecido. Trocas forçadas e frequentes demais podem levar a padrões previsíveis; siga o prazo e troque imediatamente diante de suspeita de exposição.',['Acesse o portal pelo endereço oficial ou favorito corporativo.','Use MFA quando disponível e nunca compartilhe o código.','Se esquecer a senha, utilize o fluxo oficial de recuperação.']],['Proteção contínua','A segurança da conta também depende de dispositivos atualizados, bloqueio de tela e atenção a solicitações de redefinição. Uma mensagem inesperada sobre senha pode ser phishing.',['Confirme pedidos de redefinição pelo canal oficial.','Use o gerenciador de senhas aprovado pela organização.','Reporte notificações de login ou redefinição que você não iniciou.']]],quiz:['Quando uma senha deve ser trocada?',['Sempre que uma mensagem inesperada pedir, usando o link dela.','Somente quando a política exigir ou houver suspeita de exposição, pelo canal oficial.','Depois de compartilhar a senha com outra pessoa.'],1]}
    };
    const params=new URLSearchParams(location.search);const id=params.get('course')||'phishing';const correlationId=params.get('cid')||'';let course=courses[id]||null;let index=0;const done=new Set();
    async function track(type){if(!correlationId)return;try{await fetch('/api/training-events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,course_id:id,correlation_id:correlationId})});}catch(error){/* O curso continua disponível mesmo se o rastreio estiver offline. */}}
    function normalizeCourse(remote){const quiz=remote.quiz||{};return {...remote,modules:(remote.modules||[]).map(module=>Array.isArray(module)?{title:module[0]||'Módulo',text:module[1]||'',points:module[2]||[]}:module),quiz:[quiz.question||'Qual é a atitude mais segura?',Array.isArray(quiz.options)?quiz.options:['Seguir o canal oficial.','Compartilhar a informação.','Ignorar o alerta.'],Number.isInteger(quiz.answer)?quiz.answer:0]};}
    const $=selector=>document.querySelector(selector);const esc=value=>String(value??'').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[character]));function draw(){const module=course.modules[index];$('#course-title').textContent=course.title;$('#course-summary').textContent=course.summary;$('#module-nav').innerHTML=course.modules.map((item,i)=>`<button type="button" class="${i===index?'active ':''}${done.has(i)?'done':''}" data-index="${i}">${i+1}</button>`).join('')+'<button type="button" class="'+(done.size===course.modules.length?'done':'')+'" data-quiz="true">✓</button>';$('#module-title').textContent=module.title||module[0];$('#module-text').textContent=module.text||module[1];const points=module.points||module[2]||[];$('#module-points').innerHTML=points.map(point=>`<div class="point"><b>✓</b><span>${esc(point)}</span></div>`).join('');$('#previous-button').disabled=index===0;$('#next-button').textContent=done.has(index)?(index===course.modules.length-1?'Ir para avaliação':'Próximo módulo'):'Marcar módulo como lido';}
    function showQuiz(){$('#quiz').classList.add('show');$('#quiz-question').textContent=course.quiz[0];$('#quiz-options').innerHTML=course.quiz[1].map((option,i)=>`<label><input type="radio" name="answer" value="${i}"> ${esc(option)}</label>`).join('');$('#quiz').scrollIntoView({behavior:'smooth',block:'start'});}
    $('#module-nav').addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.quiz)showQuiz();else{index=Number(button.dataset.index);draw();}});$('#previous-button').addEventListener('click',()=>{if(index>0){index-=1;draw();}});$('#next-button').addEventListener('click',()=>{done.add(index);if(index<course.modules.length-1){index+=1;draw();}else showQuiz();});$('#quiz-button').addEventListener('click',async()=>{const answer=Number(document.querySelector('input[name="answer"]:checked')?.value);if(answer!==course.quiz[2]){$('#notice').textContent='Resposta incorreta. Revise os módulos e tente novamente.';$('#notice').classList.add('show');return;}$('#notice').textContent='Curso concluído com sucesso. Sua avaliação foi aprovada.';$('#notice').classList.add('show');$('#quiz-button').disabled=true;await track('completed');});async function loadCourse(){if(!course){try{const response=await fetch('/api/training-course?course='+encodeURIComponent(id));if(response.ok)course=normalizeCourse(await response.json());}catch(error){}}if(!course)course=courses.phishing;draw();track('opened');}loadCourse();
  </script>
</body>
</html>
