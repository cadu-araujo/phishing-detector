<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#11201e" />
    <title>Sistema FIEAM · Dashboard</title>
    <link rel="stylesheet" href="styles.css?v=20261002-10" />
  </head>
  <body>
    <!--
      THESIS: um cockpit de risco humano que transforma eventos isolados em evolução visível, recusando a tela genérica de métricas.
      OWN-WORLD: marinho profundo, papel mineral, ciano de controle e lima de sinal; listas densas, divisores finos e estados legíveis.
      STORY: a equipe identifica o que mudou, interpreta a campanha em contexto e escolhe a próxima ação educativa.
      FIRST VIEWPORT: navegação fixa à esquerda; campanha ativa em painel de leitura à esquerda; números, tendência e próxima ação à direita.
      FORM: Operate, composição de cockpit editorial, construída diretamente para um MVP interno do FPAP.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegação principal">
        <div class="brand-lockup">
          <img class="dashboard-brand-logo" src="assets/logo-fieam.png" alt="Sistema FIEAM" />
        </div>

        <div class="workspace-switcher">
          <div class="workspace-avatar">SI</div>
          <div>
            <small>Ambiente</small>
            <strong>Sistema FIEAM</strong>
          </div>
          <button class="icon-button subtle" aria-label="Trocar ambiente">⌄</button>
        </div>

        <nav class="main-nav">
          <p class="nav-label">Operação</p>
          <button class="nav-item active" data-view="dashboard"><span class="nav-icon">⌂</span> Visão geral</button>
          <button class="nav-item" data-view="campaigns"><span class="nav-icon">◌</span> Campanhas <b class="nav-count">3</b></button>
          <button class="nav-item" data-view="layouts"><span class="nav-icon">▧</span> Layouts</button>
          <button class="nav-item" data-view="people"><span class="nav-icon">◉</span> Pessoas</button>
          <button class="nav-item" data-view="groups"><span class="nav-icon">◎</span> Grupos</button>

          <p class="nav-label nav-label-spaced">Aprendizado</p>
          <button class="nav-item" data-view="training"><span class="nav-icon">▣</span> Treinamentos</button>
          <button class="nav-item" data-view="reports"><span class="nav-icon">▤</span> Relatórios</button>

          <p class="nav-label nav-label-spaced">Governança</p>
          <button class="nav-item" data-view="audit"><span class="nav-icon">◫</span> Auditoria</button>
          <button class="nav-item" data-view="settings"><span class="nav-icon">◒</span> Configurações</button>
        </nav>

        <div class="sidebar-footer">
          <div class="pilot-note">
            <span class="live-dot"></span>
            <div><strong>Programa ativo</strong><small id="sidebar-campaign-count">0 campanhas neste ciclo</small></div>
          </div>
          <div class="user-profile">
            <div class="user-avatar">LC</div>
            <div><strong>Lucas Cordeiro</strong><small>Gestor de SI</small></div>
            <button class="icon-button subtle logout-button" data-action="logout" aria-label="Sair do aplicativo" title="Sair">↪</button>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="mobile-menu" aria-label="Abrir menu">☰</button>
          <div class="breadcrumbs"><span>Sistema FIEAM</span><i>/</i><strong id="breadcrumb-current">Visão geral</strong></div>
          <div class="topbar-actions">
            <label class="search-box" aria-label="Buscar na plataforma"><span>⌕</span><input id="global-search" type="search" placeholder="Buscar campanhas, pessoas..." /></label>
            <button class="icon-button notification" aria-label="Notificações"><span>♢</span><b></b></button>
            <button class="help-button">Ajuda <span>?</span></button>
          </div>
        </header>

        <div id="view-root" class="view-root"></div>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>
    <script src="app.js?v=20261002-18"></script>
  </body>
</html>
